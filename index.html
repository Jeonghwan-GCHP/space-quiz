<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우주 탐사 퀴즈</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #6366f1;
      --success: #10b981;
      --error: #ef4444;
      --bg-light: #f8fafc;
      --bg-white: #ffffff;
      --text-dark: #1e293b;
      --text-gray: #64748b;
      --border: #e2e8f0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-light: #0f172a;
        --bg-white: #1e293b;
        --text-dark: #f1f5f9;
        --text-gray: #cbd5e1;
        --border: #334155;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      background: linear-gradient(135deg, var(--primary) 0%, #8b5cf6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text-dark);
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--bg-white);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-gray);
    }

    /* Progress Bar */
    .progress-container {
      margin-bottom: 24px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--text-gray);
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #8b5cf6);
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 4px;
    }

    /* Score Counter - Mission Control Display */
    .score-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 20px;
      background: linear-gradient(135deg, var(--bg-light) 0%, rgba(99, 102, 241, 0.05) 100%);
      border-radius: 12px;
      border: 2px solid var(--primary);
      position: relative;
      overflow: hidden;
      box-shadow: 
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        0 0 20px rgba(99, 102, 241, 0.2);
    }

    .score-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(99, 102, 241, 0.03) 2px,
          rgba(99, 102, 241, 0.03) 4px
        );
      pointer-events: none;
    }

    .score-container > div {
      position: relative;
      z-index: 1;
    }

    .score-container > div:not(:last-child) {
      flex: 1;
    }

    .score-label {
      font-size: 11px;
      color: var(--text-gray);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .score-label::before {
      content: '◆';
      font-size: 8px;
      color: var(--primary);
    }

    .score-value {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-variant-numeric: tabular-nums;
      font-family: 'Monaco', 'Courier New', monospace;
      letter-spacing: 2px;
    }

    @media (prefers-color-scheme: dark) {
      .score-container {
        box-shadow: 
          inset 0 1px 0 rgba(255, 255, 255, 0.05),
          0 0 30px rgba(99, 102, 241, 0.3);
        border-color: rgba(99, 102, 241, 0.6);
      }
    }

    /* Quiz Content */
    .quiz-content {
      min-height: 300px;
    }

    .question-box {
      margin-bottom: 24px;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .question-text {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option {
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--bg-light);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
      color: var(--text-dark);
      text-align: left;
    }

    .option:hover:not(.disabled) {
      border-color: var(--primary);
      background: var(--bg-white);
      transform: translateX(4px);
    }

    .option.disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .option.correct {
      background: var(--success);
      border-color: var(--success);
      color: white;
      animation: pulse 0.4s ease-out;
    }

    .option.incorrect {
      background: var(--error);
      border-color: var(--error);
      color: white;
      animation: shake 0.5s ease-out;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.02);
      }
    }

    @keyframes shake {
      0%, 100% {
        transform: translateX(0);
      }
      25% {
        transform: translateX(-8px);
      }
      75% {
        transform: translateX(8px);
      }
    }

    /* Results Screen */
    .results-screen {
      display: none;
      text-align: center;
      animation: slideUp 0.5s ease-out;
    }

    .results-screen.show {
      display: block;
    }

    .emoji-reaction {
      font-size: 80px;
      margin-bottom: 16px;
      animation: bounce 0.6s ease-out;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-20px);
      }
    }

    .results-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 12px;
    }

    .results-score {
      font-size: 48px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 24px;
    }

    .results-message {
      font-size: 16px;
      color: var(--text-gray);
      margin-bottom: 30px;
      line-height: 1.6;
    }

    /* Buttons */
    .button {
      width: 100%;
      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .button-primary {
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      color: white;
      margin-top: 20px;
    }

    .button-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
    }

    .button-primary:active {
      transform: translateY(0);
    }

    /* Hidden */
    .hidden {
      display: none;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .container {
        padding: 24px;
        border-radius: 16px;
      }

      .title {
        font-size: 24px;
      }

      .question-text {
        font-size: 16px;
      }

      .results-score {
        font-size: 40px;
      }

      .emoji-reaction {
        font-size: 60px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="title">🚀 우주 탐사 퀴즈</div>
      <div class="subtitle">당신은 우주에 대해 얼마나 알고 있나요?</div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-container" id="progressContainer">
      <div class="progress-info">
        <span id="progressText">문제 1 / 10</span>
        <span id="timerText"></span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <!-- Score Counter -->
    <div class="score-container">
      <div>
        <div class="score-label">현재 점수</div>
        <div class="score-value" id="scoreValue">0</div>
      </div>
      <div style="text-align: right;">
        <div class="score-label">정답 / 총문제</div>
        <div class="score-value"><span id="correctCount">0</span>/10</div>
      </div>
    </div>

    <!-- Quiz Content -->
    <div class="quiz-content" id="quizContent">
      <div class="question-box">
        <div class="question-text" id="questionText"></div>
        <div class="options" id="optionsContainer"></div>
      </div>
    </div>

    <!-- Results Screen -->
    <div class="results-screen" id="resultsScreen">
      <div class="emoji-reaction" id="emojiReaction">🌟</div>
      <div class="results-title">퀴즈 완료!</div>
      <div class="results-score" id="finalScore">0/10</div>
      <div class="results-message" id="resultMessage"></div>
      <button class="button button-primary" id="reviewButton" onclick="startReview()" style="display: none;">복습하기</button>
      <button class="button button-primary" onclick="location.reload()">다시 시작</button>
    </div>
  </div>

  <script>
    const quizData = [
      {
        question: "태양계에서 가장 큰 행성은 무엇인가요?",
        options: ["토성", "목성", "천왕성", "해왕성"],
        correct: 1
      },
      {
        question: "지구가 태양 주위를 한 바퀴 도는 데 걸리는 시간은?",
        options: ["11개월", "1년", "2년", "3년"],
        correct: 1
      },
      {
        question: "화성은 어떤 색깔로 보이나요?",
        options: ["파란색", "노란색", "빨간색", "초록색"],
        correct: 2
      },
      {
        question: "태양의 중심에서 일어나는 핵반응의 이름은?",
        options: ["핵분열", "핵융합", "태양흑점", "코로나"],
        correct: 1
      },
      {
        question: "우주에서 가장 밝은 별 중 하나는?",
        options: ["폴라리스", "시리우스", "베가", "리겔"],
        correct: 1
      },
      {
        question: "달이 지구 주위를 한 바퀴 도는 데 걸리는 시간은?",
        options: ["7일", "14일", "약 27일", "1개월"],
        correct: 2
      },
      {
        question: "블랙홀은 어떤 현상인가요?",
        options: ["우주의 빈 공간", "빛이 탈출할 수 없는 영역", "작은 행성", "별의 배경"],
        correct: 1
      },
      {
        question: "우리 은하의 이름은?",
        options: ["안드로메다", "은하수", "삼각형", "마젤란 구름"],
        correct: 1
      },
      {
        question: "태양 외부의 별 주위를 도는 행성을 뭐라고 부르나요?",
        options: ["위성", "소행성", "외계행성", "혜성"],
        correct: 2
      },
      {
        question: "국제우주정거장(ISS)은 약 몇 분마다 지구를 한 바퀴 도나요?",
        options: ["30분", "60분", "90분", "120분"],
        correct: 2
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let correct = 0;
    let answered = false;
    let wrongAnswers = [];
    let isReviewMode = false;
    let reviewMode = {
      currentQuestion: 0,
      score: 0,
      correct: 0
    };

    function init() {
      score = 0;
      correct = 0;
      currentQuestion = 0;
      answered = false;
      document.getElementById("resultsScreen").classList.remove("show");
      document.getElementById("quizContent").style.display = "block";
      document.getElementById("progressContainer").style.display = "block";
      loadQuestion();
    }

    function loadQuestion() {
      if (currentQuestion >= quizData.length) {
        showResults();
        return;
      }

      answered = false;
      const question = quizData[currentQuestion];
      const progressPercent = ((currentQuestion + 1) / quizData.length) * 100;

      document.getElementById("questionText").textContent = question.question;
      document.getElementById("progressText").textContent = `문제 ${currentQuestion + 1} / 10`;
      document.getElementById("progressBar").style.width = progressPercent + "%";

      const container = document.getElementById("optionsContainer");
      container.innerHTML = "";

      question.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.className = "option";
        button.textContent = option;
        button.onclick = () => selectOption(index, question.correct);
        container.appendChild(button);
      });

      document.querySelector(".option")?.focus();
    }

    function loadReviewQuestion() {
      if (reviewMode.currentQuestion >= wrongAnswers.length) {
        showReviewResults();
        return;
      }

      answered = false;
      const questionIndex = wrongAnswers[reviewMode.currentQuestion];
      const question = quizData[questionIndex];
      const progressPercent = ((reviewMode.currentQuestion + 1) / wrongAnswers.length) * 100;

      document.getElementById("questionText").textContent = question.question;
      document.getElementById("progressText").textContent = `복습 ${reviewMode.currentQuestion + 1} / ${wrongAnswers.length}`;
      document.getElementById("progressBar").style.width = progressPercent + "%";

      const container = document.getElementById("optionsContainer");
      container.innerHTML = "";

      question.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.className = "option";
        button.textContent = option;
        button.onclick = () => selectOption(index, question.correct);
        container.appendChild(button);
      });

      document.querySelector(".option")?.focus();
    }

    function selectOption(selectedIndex, correctIndex) {
      if (answered) return;
      answered = true;

      const options = document.querySelectorAll(".option");
      options.forEach((opt) => opt.classList.add("disabled"));

      const selectedOption = options[selectedIndex];
      const correctOption = options[correctIndex];

      if (selectedIndex === correctIndex) {
        selectedOption.classList.add("correct");
        if (isReviewMode) {
          reviewMode.score += 10;
          reviewMode.correct++;
        } else {
          score += 10;
          correct++;
        }
      } else {
        selectedOption.classList.add("incorrect");
        correctOption.classList.add("correct");
        if (!isReviewMode) {
          wrongAnswers.push(currentQuestion);
        }
      }

      if (isReviewMode) {
        document.getElementById("scoreValue").textContent = reviewMode.score;
        document.getElementById("correctCount").textContent = reviewMode.correct;
      } else {
        document.getElementById("scoreValue").textContent = score;
        document.getElementById("correctCount").textContent = correct;
      }

      setTimeout(() => {
        if (isReviewMode) {
          reviewMode.currentQuestion++;
          loadReviewQuestion();
        } else {
          currentQuestion++;
          loadQuestion();
        }
      }, 1200);
    }

    function showResults() {
      document.getElementById("quizContent").style.display = "none";
      document.getElementById("progressContainer").style.display = "none";

      const percentage = (correct / quizData.length) * 100;
      const resultScreen = document.getElementById("resultsScreen");
      
      resultScreen.classList.add("show");
      document.getElementById("finalScore").textContent = `${correct}/10`;

      let emoji, message;
      if (percentage === 100) {
        emoji = "🌟";
        message = "완벽합니다! 당신은 우주 전문가입니다!";
      } else if (percentage >= 80) {
        emoji = "🚀";
        message = "훌륭합니다! 우주에 대해 아주 잘 알고 있네요.";
      } else if (percentage >= 60) {
        emoji = "🌍";
        message = "좋습니다! 더 배울 수 있을 것 같아요.";
      } else if (percentage >= 40) {
        emoji = "🌙";
        message = "조금 더 노력해보세요!";
      } else {
        emoji = "🔭";
        message = "우주 탐사를 계속해보세요!";
      }

      document.getElementById("emojiReaction").textContent = emoji;
      document.getElementById("resultMessage").textContent = message;

      const reviewButton = document.getElementById("reviewButton");
      if (wrongAnswers.length > 0 && percentage < 100) {
        reviewButton.style.display = "block";
      } else {
        reviewButton.style.display = "none";
      }
    }

    function startReview() {
      isReviewMode = true;
      reviewMode.currentQuestion = 0;
      reviewMode.score = 0;
      reviewMode.correct = 0;

      document.getElementById("resultsScreen").classList.remove("show");
      document.getElementById("quizContent").style.display = "block";
      document.getElementById("progressContainer").style.display = "block";
      document.getElementById("scoreValue").textContent = "0";
      document.getElementById("correctCount").textContent = "0";

      loadReviewQuestion();
    }

    function showReviewResults() {
      document.getElementById("quizContent").style.display = "none";
      document.getElementById("progressContainer").style.display = "none";

      const percentage = (reviewMode.correct / wrongAnswers.length) * 100;
      const resultScreen = document.getElementById("resultsScreen");
      
      resultScreen.classList.add("show");
      document.getElementById("finalScore").textContent = `${reviewMode.correct}/${wrongAnswers.length}`;

      let emoji, message;
      if (percentage === 100) {
        emoji = "🌟";
        message = "완벽합니다! 이제 모두 이해했어요!";
      } else if (percentage >= 80) {
        emoji = "🚀";
        message = "훌륭합니다! 많이 개선되었어요.";
      } else if (percentage >= 60) {
        emoji = "🌍";
        message = "좋습니다! 계속 공부해보세요.";
      } else if (percentage >= 40) {
        emoji = "🌙";
        message = "조금 더 노력하면 될 것 같아요!";
      } else {
        emoji = "🔭";
        message = "한 번 더 복습해보세요!";
      }

      document.getElementById("emojiReaction").textContent = emoji;
      document.getElementById("resultMessage").textContent = message;
      document.getElementById("reviewButton").style.display = "none";
    }

    // Start the quiz
    init();
  </script>
</body>
</html>
